name: CI

on:
  push:
    branches: ["main", "garrett-hamers-*", "certification"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - run: npm run typecheck
      - run: npm run eslint
      - run: npm run build
      - run: npm run publication:assets:enforce
      - run: npm run package
      # The packaged-artifact tests skip when no .pbiviz exists, which is the case on the
      # first `npm test` above. Re-run them now that the package has been built, so the
      # loadability gate actually executes in CI.
      - run: npm test -- tests/packaging.test.ts
      # Sticky positioning and containing-block resolution are layout, and jsdom performs
      # no layout, so this is the only gate that can see them. It renders the packaged
      # content.js/content.css out of the .pbiviz just built above, in headless Chromium.
      - run: npm run render:check
      - run: npm audit
      # Publish the built .pbiviz so its hash can be verified by download-and-rehash rather
      # than trusted from a report. A reported hash goes stale the moment another change
      # merges; the artifact is ground truth for the commit that produced it. Only reached
      # when every gate above has passed, so a published artifact is always a validated one.
      - uses: actions/upload-artifact@v4
        with:
          name: atlyn-cohort-retention-pbiviz
          path: |
            dist/atlyn-cohort-retention.pbiviz
            dist/package-metadata.json
          if-no-files-found: error
