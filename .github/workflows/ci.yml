name: CI

on:
  push:
    branches: ["main", "garrett-hamers-*", "certification"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - run: npm run typecheck
      - run: npm run eslint
      - run: npm run build
      - run: npm run publication:assets:enforce
      - run: npm run package
      # The packaged-artifact tests skip when no .pbiviz exists, which is the case on the
      # first `npm test` above. Re-run them now that the package has been built, so the
      # loadability gate actually executes in CI.
      - run: npm test -- tests/packaging.test.ts
      - run: npm audit
